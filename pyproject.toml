[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kantarhl_diffusion2d"
version = "0.0.1"
authors = [{ name = "Hazal Kantar" }]
description = "A finite-difference solver for two-dimensional heat diffusion"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]
keywords = ["diffusion", "simulation", "finite difference", "heat transfer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/hazalkntr/diffusion2d.git "
Source = "https://github.com/hazalkntr/diffusion2d.git "

[tool.setuptools]
packages = ["kantarhl_diffusion2d"]
