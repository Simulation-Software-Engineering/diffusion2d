[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rofailan_diffusion2d"
version = "0.0.2"
description = "A Python package for simulating the two-dimensional heat diffusion equation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib"
]
authors = [
    {name = "Anton"}
]


[project.urls]
Repository = "https://github.com/AntonRfl/diffusion2d"