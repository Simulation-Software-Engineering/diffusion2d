[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name="variyaah_diffusion2d"
authors = [
    { name = "variyaah",  email="st198348@stud.uni-stuttgart.de"}
]
readme = "README.md"
description= "Solves the diffusion equation using the finite-difference method"
keywords = ["diffusion", "simulation", "plot", "axes"]
license = "CC-BY-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
version = "0.0.1"
dependencies = [
    "numpy",
    "matplotlib",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
gui = ["PyQt6"]

[project.urls]
Repository = "https://github.com/akulvj/diffusion2d"