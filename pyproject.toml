[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandisro_diffusion2d" 
version = "0.0.1"
description = "2D diffusion equation solver and visualizer (from scipython example)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ricardo Sandi", email = "rickysandis@gmail.com"}]
keywords = ["diffusion", "finite-difference", "2d", "simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.20",
  "matplotlib>=3.0"
]

[project.urls]
Homepage = "https://github.com/RickySandi"  

[tool.setuptools.packages.find]
where = ["."]
include = ["sandisro_diffusion2d*"]